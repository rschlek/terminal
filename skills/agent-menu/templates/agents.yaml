# Agent menu config: how each agent CLI is launched. Read by the agent menu and by
# the new-warp-chat launcher; edit it here, nothing else holds these flags.
#
# Format (flat, read line by line - not full YAML):
#   key: value         a top-level setting
#   name:              an agent block; its settings follow, indented two spaces
# A value runs verbatim to the end of the line: quotes are kept as typed and a #
# is part of the value (no inline comments). {args} in a command line is
# replaced by the block's args, and dropped when args is empty.
#
# Optional per block: new_project, the line the "+ new project" row in the
# project view runs in projects_root. Remove the "# " before it to turn the row on.
#
# Optional per block: session_list. With `claude`, Resume lists past chats from
# every folder, read from Claude Code's session store, and reopens the one picked
# with the block's resume line plus its session id; with `off`, Resume runs the
# resume line as it is. A block named claude gets `claude` when the key is absent,
# every other block `off`. Optional `sessions`: the projects folder of the Claude
# Code store Resume reads, when it is not the default (CLAUDE_CONFIG_DIR or
# ~/.claude, plus /projects).
#
# Optional per block: modes, for launching the same CLI against different
# backends or profiles from one tab. Each `mode: <name>` line adds a mode, in the
# order the menu cycles them (M on the home screen, Shift+M in the pickers); the
# first is the default and the menu remembers the last one picked. A
# `<name>.<key>: value` line (new, resume, resume_all, new_project, args,
# sessions, session_list) replaces that key in that mode; any key a mode leaves
# out comes from the block. A mode name may hold any character but a colon. A
# mode's line gets args only where it says {args}. Example:
#   mode: default
#   mode: other
#   other.new: other-launcher
#   other.resume: other-launcher --resume
#   other.sessions: ~/.other-profile/projects

# The folder whose subfolders the menu lists under "Project...".
projects_root:

# The menu's first entry: home (a fresh session in the home folder) or
# projects_root (a fresh session in projects_root, then Project... and Resume,
# with Home moved to the end; Resume then opens in projects_root too).
start_in: home

claude:
  args:
  new: claude {args}
  resume: claude {args} --resume
  # session_list: off
  # new_project: claude {args} "Create a new project in this folder."

codex:
  args:
  new: codex {args}
  resume: codex resume {args}
  resume_all: codex resume --all {args}
  # new_project: codex {args} "Create a new project in this folder."
